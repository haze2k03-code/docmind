services:
  db:
    # Official Postgres 16 image with the pgvector extension pre-installed.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
      POSTGRES_DB: docmind
    ports:
      - "5433:5432" # 5433 on your laptop, so it won't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docmind -d docmind"]
      interval: 5s
      retries: 10

  server:
    build: ./server
    env_file: .env
    environment:
      # Inside Docker the API reaches Postgres by its service name, not localhost.
      DATABASE_URL: postgres://docmind:docmind@db:5432/docmind
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  web:
    build:
      context: ./web
      args:
        API_URL: http://server:4000
    depends_on:
      - server
    ports:
      - "3000:3000"

volumes:
  pgdata:
